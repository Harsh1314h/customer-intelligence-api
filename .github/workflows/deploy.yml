name: Test, Build, and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"
  SERVICE_NAME: customer-intelligence-api
  GCP_REGION: asia-south1
  GCP_ARTIFACT_REPOSITORY: customer-intelligence

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest

  deploy-gcp:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      CI_MODEL_ARTIFACT_URI: ${{ secrets.CI_MODEL_ARTIFACT_URI }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip deploy when GCP secrets are absent
        if: env.GCP_PROJECT_ID == '' || env.GCP_SA_KEY == ''
        run: echo "GCP deployment skipped because GCP_PROJECT_ID or GCP_SA_KEY is not configured."
      - id: auth
        if: env.GCP_PROJECT_ID != '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: env.GCP_PROJECT_ID != '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        if: env.GCP_PROJECT_ID != '' && env.GCP_SA_KEY != ''
        run: |
          gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/$SERVICE_NAME:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        if: env.GCP_PROJECT_ID != '' && env.GCP_SA_KEY != ''
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "CI_MODEL_ARTIFACT_URI=$CI_MODEL_ARTIFACT_URI,CI_ALLOW_DEMO_MODELS=false"
