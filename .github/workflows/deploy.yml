name: Test, Build, and Deploy to AWS ECS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Deployment is manual on purpose. A live ECS Express service plus its load balancer
  # costs roughly $26/month, so it is not something a routine push should create.
  # Deploy from the Actions tab: "Run workflow".
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: customer-intelligence-api
  SERVICE_NAME: customer-intelligence-api
  ECS_CLUSTER: default

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest

  deploy-aws:
    needs: test
    # Manual dispatch only. Pushing to main runs the test job but does not deploy,
    # so no AWS resources are created as a side effect of a code change.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      CI_MODEL_ARTIFACT_URI: ${{ secrets.CI_MODEL_ARTIFACT_URI }}
      ECS_TASK_EXECUTION_ROLE_ARN: ${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}
      ECS_INFRASTRUCTURE_ROLE_ARN: ${{ secrets.ECS_INFRASTRUCTURE_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if missing
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy ECS Express service
        if: env.ECS_TASK_EXECUTION_ROLE_ARN != '' && env.ECS_INFRASTRUCTURE_ROLE_ARN != '' && env.CI_MODEL_ARTIFACT_URI != ''
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          execution-role-arn: ${{ env.ECS_TASK_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ env.ECS_INFRASTRUCTURE_ROLE_ARN }}
          task-role-arn: ${{ env.ECS_TASK_EXECUTION_ROLE_ARN }}
          cluster: ${{ env.ECS_CLUSTER }}
          container-port: 8080
          cpu: 256
          memory: 512
          environment-variables: '[{"name":"CI_MODEL_ARTIFACT_URI","value":"${{ env.CI_MODEL_ARTIFACT_URI }}"},{"name":"CI_ALLOW_DEMO_MODELS","value":"false"}]'
          health-check-path: /health

      - name: Print deployment summary
        run: |
          echo "ECS Express deployment requested for $SERVICE_NAME"
          echo "Image: $IMAGE_URI"
          if [ -z "$ECS_TASK_EXECUTION_ROLE_ARN" ] || [ -z "$ECS_INFRASTRUCTURE_ROLE_ARN" ] || [ -z "$CI_MODEL_ARTIFACT_URI" ]; then
            echo "ECS Express deployment skipped because ECS secrets are not fully configured yet."
          fi
          echo ""
          echo "REMINDER: this service and its load balancer cost roughly \$26/month."
          echo "Tear it down when the demo is finished:"
          echo "  aws ecs delete-express-gateway-service \\"
          echo "    --service-arn arn:aws:ecs:$AWS_REGION:188947281989:service/$ECS_CLUSTER/$SERVICE_NAME \\"
          echo "    --region $AWS_REGION"
